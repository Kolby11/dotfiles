# ═══════════════════════════════════════════════════════════════════════════
#  kitty.conf — riced, matugen-themed (colors come from current-theme.conf)
# ═══════════════════════════════════════════════════════════════════════════

# ── Fonts ──────────────────────────────────────────────────────────────────
font_family      FiraCode Nerd Font
bold_font        FiraCode Nerd Font SemiBold
italic_font      auto
bold_italic_font auto
font_size        11.0

# FiraCode ligatures are on by default; keep them, but never merge the glyph
# sitting under the cursor so you can always read what you're editing.
disable_ligatures cursor
text_composition_strategy platform

# ── Cursor (fancy animated trail — kitty ≥ 0.36) ────────────────────────────
cursor_shape             beam
cursor_beam_thickness    1
cursor_blink_interval    -1
cursor_stop_blinking_after 15.0
# The marquee/trail that smoothly chases the cursor around the screen.
cursor_trail             3
cursor_trail_decay       0.2 0.6
cursor_trail_start_threshold 1

# ── Scrollback ──────────────────────────────────────────────────────────────
scrollback_lines             20000
scrollback_pager_history_size 10
scrollback_fill_enlarged_window yes

# ── Mouse ────────────────────────────────────────────────────────────────────
mouse_hide_wait      3.0
copy_on_select       clipboard
strip_trailing_spaces smart
focus_follows_mouse  no
url_style            curly
detect_urls          yes
underline_hyperlinks hover
show_hyperlink_targets yes

# ── Window & padding ─────────────────────────────────────────────────────────
remember_window_size   no
initial_window_width   1080
initial_window_height  640
window_padding_width   14
placement_strategy     center
hide_window_decorations yes
confirm_os_window_close 0
resize_in_steps        no

# Transparency: let the wallpaper show through while keeping terminal text
# readable against brighter parts of the background.
background_opacity        0.85
dynamic_background_opacity yes
# Dim windows that don't have focus for a subtle depth effect.
inactive_text_alpha       0.80

# ── Layouts (splits + stack + more) ─────────────────────────────────────────
enabled_layouts splits:split_axis=horizontal,stack,tall,fat,grid,vertical
window_border_width 1.0pt
draw_minimal_borders yes

# ── Tab bar (powerline, slanted) ────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_align       left
tab_bar_min_tabs    2
tab_activity_symbol " "
bell_on_tab         "󰂚 "
tab_title_template  "{activity_symbol}{index} {title[:24]}"
active_tab_font_style   bold
inactive_tab_font_style italic

# ── Bell ─────────────────────────────────────────────────────────────────────
enable_audio_bell     no
visual_bell_duration  0.10
visual_bell_color     none
window_alert_on_bell  yes

# ── Performance ──────────────────────────────────────────────────────────────
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ── Shell / Advanced ─────────────────────────────────────────────────────────
# Use fish for its autosuggestions + completions (prompt is oh-my-posh via
# ~/.config/fish/config.fish). Comment this out to fall back to the login shell.
shell                 fish
allow_remote_control  yes
listen_on             unix:@mykitty
# Keep included Matugen theme changes live even if the post-hook is missed.
auto_reload_config    0.1
shell_integration     enabled
term                  xterm-kitty
notify_on_cmd_finish  unfocused 10.0

# ═══════════════════════════════════════════════════════════════════════════
#  Keybindings — splits, tabs, font size, hints
# ═══════════════════════════════════════════════════════════════════════════
# Splits (window management)
map ctrl+shift+enter    launch --location=hsplit --cwd=current
map ctrl+shift+\        launch --location=vsplit --cwd=current
map ctrl+shift+w        close_window
map ctrl+shift+h        neighboring_window left
map ctrl+shift+l        neighboring_window right
map ctrl+shift+k        neighboring_window up
map ctrl+shift+j        neighboring_window down
map ctrl+shift+f        move_window_forward
map ctrl+shift+space    next_layout

# Tabs
map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+q        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+.        move_tab_forward
map ctrl+shift+,        move_tab_backward
map ctrl+shift+alt+t    set_tab_title

# Font size
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+plus     change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+0        change_font_size all 0

# Opacity (live ricing)
map ctrl+shift+a>m      set_background_opacity +0.05
map ctrl+shift+a>l      set_background_opacity -0.05
map ctrl+shift+a>1      set_background_opacity 1.0
map ctrl+shift+a>d      set_background_opacity default

# Hints — grab URLs / paths / lines / hashes without the mouse
map ctrl+shift+e        open_url_with_hints
map ctrl+shift+p>f      kitten hints --type path --program -
map ctrl+shift+p>l      kitten hints --type line --program -
map ctrl+shift+p>h      kitten hints --type hash --program -

# Misc
map ctrl+shift+u        kitten unicode_input
map ctrl+shift+f2       edit_config_file
map ctrl+shift+f5       load_config_file
map ctrl+shift+escape   kitten kitty_shell window

# ── Look layer (non-color surface knobs: opacity, padding, blur) ─────────────
# Written by the `look` CLI; safe to be absent (created empty on first apply).
include current-look.conf

# ── Theme (matugen-generated — MUST stay last so its colors win) ─────────────
# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME
