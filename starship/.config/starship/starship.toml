"$schema" = 'https://starship.rs/config-schema.json'

# ═══════════════════════════════════════════════════════════════════════════
#  Starship — riced powerline prompt.
#  Segment colors reference ANSI slots (blue/cyan/green/yellow/purple/red),
#  which your kitty matugen theme fills from the wallpaper — so the prompt
#  automatically matches whatever colorscheme is active.
# ═══════════════════════════════════════════════════════════════════════════

add_newline = true
palette = "matugen"

format = """
[](fg:seg_os)\
$os\
$username\
[](fg:seg_os bg:seg_dir)\
$directory\
[](fg:seg_dir bg:seg_git)\
$git_branch\
$git_status\
$git_state\
[](fg:seg_git bg:seg_lang)\
${custom.langsep}\
$nodejs$python$rust$golang$c$java$kotlin$php$haskell$lua$ruby$nix_shell$package\
[](fg:seg_lang bg:seg_ctx)\
$docker_context$kubernetes\
[](fg:seg_ctx)\
$fill\
$cmd_duration$jobs$battery$time\
$line_break\
$character"""

# ── Palette: semantic names → ANSI slots (matugen-controlled) ────────────────
[palettes.matugen]
seg_os   = "blue"
seg_dir  = "cyan"
seg_git  = "green"
seg_lang = "yellow"
seg_ctx  = "purple"
ink      = "black"       # dark text that sits on the light pastel segments
muted    = "bright-black"
good     = "green"
bad      = "red"
warn     = "yellow"

# ── OS / user block ──────────────────────────────────────────────────────────
[os]
disabled = false
style = "fg:ink bg:seg_os"
format = "[ $symbol ]($style)"

[os.symbols]
NixOS = ""
Arch = ""
Debian = ""
Ubuntu = ""
Fedora = ""
Macos = ""
Windows = ""
Linux = ""

[username]
show_always = true
style_user = "fg:ink bg:seg_os"
style_root = "fg:bad bg:seg_os bold"
format = "[$user ]($style)"

[hostname]
ssh_only = true
style = "fg:ink bg:seg_os"
format = "[@$hostname ]($style)"

# ── Directory ────────────────────────────────────────────────────────────────
[directory]
style = "fg:ink bg:seg_dir"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = " "
read_only = " "
read_only_style = "fg:bad bg:seg_dir"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰎈 "
"Pictures"  = " "
"Videos"    = " "
"Desktop"   = " "
".config"   = " "
"GitHub"    = " "
"~/.config/nixos" = "󱄅 nixos"

# ── Git ──────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "fg:ink bg:seg_git"
format = "[ $symbol$branch ]($style)"
truncation_length = 20
truncation_symbol = "…"

[git_status]
style = "fg:ink bg:seg_git"
format = "[$all_status$ahead_behind]($style)"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = " ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
style = "fg:bad bg:seg_git"
format = '[ \($state $progress_current/$progress_total\)]($style)'
rebase = "REBASE"
merge = "MERGE"
revert = "REVERT"
cherry_pick = " PICK"
bisect = "BISECT"

# ── Language / runtime segment ───────────────────────────────────────────────
[custom.langsep]
when = true
format = "[ ](fg:ink bg:seg_lang)"

[nodejs]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[python]
symbol = " "
style = "fg:ink bg:seg_lang"
format = '[$symbol(${version})(\($virtualenv\)) ]($style)'

[rust]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[golang]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[c]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[java]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[kotlin]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[php]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[haskell]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[lua]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[ruby]
symbol = " "
style = "fg:ink bg:seg_lang"
format = "[$symbol($version) ]($style)"

[nix_shell]
symbol = "󱄅 "
style = "fg:ink bg:seg_lang"
format = "[$symbol$state( $name) ]($style)"
impure_msg = "impure"
pure_msg = "pure"

[package]
disabled = true

# ── Context segment (docker / k8s) ──────────────────────────────────────────
[docker_context]
symbol = " "
style = "fg:ink bg:seg_ctx"
format = "[ $symbol$context ]($style)"
only_with_files = true

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "fg:ink bg:seg_ctx"
format = "[ $symbol$context ]($style)"

# ── Fill + right side ────────────────────────────────────────────────────────
[fill]
symbol = " "

[cmd_duration]
min_time = 500
style = "fg:warn"
format = "[󰔟 $duration ]($style)"
show_milliseconds = false

[jobs]
symbol = " "
style = "fg:seg_ctx"
format = "[$symbol$number ]($style)"
number_threshold = 1

[battery]
format = "[$symbol$percentage ]($style)"
[[battery.display]]
threshold = 15
style = "fg:bad"
[[battery.display]]
threshold = 40
style = "fg:warn"

[time]
disabled = false
time_format = "%R"
style = "fg:muted"
format = "[  $time ]($style)"

# ── Prompt character (line 2) ────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold good)"
error_symbol = "[❯](bold bad)"
vimcmd_symbol = "[❮](bold seg_git)"
vimcmd_replace_symbol = "[❮](bold seg_ctx)"
vimcmd_visual_symbol = "[❮](bold warn)"
