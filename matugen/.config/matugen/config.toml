[config]
version_check = false

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.conf'
output_path = '~/.config/hypr/hyprland/colors.conf'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/kde/color.txt'
output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

# ── Zen Browser ─────────────────────────────────────────────────────────────
# userChrome.css imports this generated file from the profile's chrome
# directory. It is not part of the dotfiles package, so browser databases
# remain unmanaged by dotfiles.
[templates.zen]
input_path = '~/.config/matugen/templates/matugen-zen.css'
output_path = '~/.config/zen/zen-matugen.css'

# ── kitty ────────────────────────────────────────────────────────────────────
# kitty.conf `include`s current-theme.conf; SIGUSR1 makes running kitties
# live-reload their config. starship inherits its colors from this ANSI palette.
# input_path is templates/active/ - the `look` CLI populates it, per file, with
# the current look's override or the base copy (look/.config/look/looks/base).
[templates.kitty]
input_path = '~/.config/matugen/templates/active/matugen-kitty.conf'
output_path = '~/.config/kitty/current-theme.conf'
# Reload every running Kitty after the included theme file is regenerated.
# Use exact process matching so an empty pid list cannot turn into a bad kill
# invocation, and so unrelated processes are never signalled.
post_hook = 'for kitty_pid in $(pgrep -x kitty); do kill -USR1 "$kitty_pid" 2>/dev/null || true; done'

# ── VS Code ──────────────────────────────────────────────────────────────────
# Matugen owns the editor chrome, while Default Dark Modern remains the source
# of syntax highlighting so code colors do not change with the wallpaper.
[templates.vscode]
input_path = '~/.config/matugen/templates/matugen-vscode.json'
output_path = '~/.config/matugen/vscode-colors.json'
post_hook = 'bash "$HOME/.config/matugen/scripts/merge-vscode.sh" || true'

# ── oh-my-posh (active bash + fish prompt) ───────────────────────────────────
# Generate palette.json, then merge-omp.sh injects it into theme.json and
# Bash reads the theme on each prompt; Fish re-sources its long-lived renderer
# at the next prompt boundary.
[templates.omp]
input_path = '~/.config/matugen/templates/matugen-omp.json'
output_path = '~/.config/omp/palette.json'
post_hook = 'bash "$HOME/.config/matugen/scripts/merge-omp.sh" || true'

# ── Spicetify ────────────────────────────────────────────────────────────────
# Keep Spotify's palette and translucent CSS in the same Matugen pass as Kitty
# and VS Code. The mutable dotfiles launcher consumes these theme sources at
# runtime, so palette changes do not require a Nix rebuild.
# input_path is templates/active/ - see the kitty note above; the `look` CLI
# swaps these for the current look's aesthetic (glass, gloss, pill controls).
[templates.spicetify]
input_path = '~/.config/matugen/templates/active/matugen-spicetify.ini'
output_path = '~/.config/dotfiles/spicetify/.config/spicetify/Themes/Matugen/color.ini'

# ── Spicetify: Liquify tint ─────────────────────────────────────────────────
# The vendored Liquify theme (Themes/Liquify/user-base.css) is glassmorphic but
# hue-neutral. This renders the active look's tint and the post_hook stitches
# `user-base.css + _look-tint.css` into the `user.css` Spicetify actually loads.
# Must stay ABOVE spicetify_css so the stitch happens before spicetify-refresh.
[templates.spicetify_liquify]
input_path = '~/.config/matugen/templates/active/matugen-liquify.css'
output_path = '~/.config/dotfiles/spicetify/.config/spicetify/Themes/Liquify/_look-tint.css'
post_hook = 'T="$HOME/.config/dotfiles/spicetify/.config/spicetify/Themes/Liquify"; cat "$T/user-base.css" "$T/_look-tint.css" > "$T/user.css"'

[templates.spicetify_css]
input_path = '~/.config/matugen/templates/active/matugen-spicetify.css'
output_path = '~/.config/dotfiles/spicetify/.config/spicetify/Themes/Matugen/user.css'
post_hook = 'bash "$HOME/.config/dotfiles/spicetify/.local/bin/spicetify-refresh" || true'
