##! Screen
# Zoom
binde = $mainMod , Minus, exec, ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.3 # Zoom out
binde = $mainMod , Equal, exec, ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.3 # Zoom in
# Zoom with keypad
binde = $mainMod , code:82, exec, qs -c $qsConfig ipc call zoom zoomOut # [hidden] Zoom out
binde = $mainMod , code:86, exec, qs -c $qsConfig ipc call zoom zoomIn # [hidden] Zoom in
binde = $mainMod , code:82, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.1 # [hidden] Zoom out
binde = $mainMod , code:86, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.1 # [hidden] Zoom in

##! Media
