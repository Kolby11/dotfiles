binde = $mainMod , Semicolon, layoutmsg, splitratio -0.1 # [hidden]
binde = $mainMod , Apostrophe, layoutmsg, splitratio +0.1 # [hidden]
# Positioning mode
bind = $mainMod +Alt, Space, togglefloating, # Float/Tile
