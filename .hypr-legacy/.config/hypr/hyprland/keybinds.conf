# Lines ending with `# [hidden]` won't be shown on cheatsheet
# Lines starting with #! are section headings

#!
##! Shell
# These absolutely need to be on top, or they won't work consistently
bindid = $mainMod , Super_L, Toggle search, global, quickshell:searchToggleRelease # Toggle search
bindid = $mainMod , Super_R, Toggle search, global, quickshell:searchToggleRelease # [hidden] Toggle search
# bind = $mainMod , Super_L, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || fuzzel # [hidden] Launcher (fallback)
# bind = $mainMod , Super_R, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || fuzzel # [hidden] Launcher (fallback)
binditn = $mainMod , catchall, global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = Ctrl, Super_L, global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = Ctrl, Super_R, global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = $mainMod , mouse:272, global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = $mainMod , mouse:273, global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = $mainMod , mouse:274, global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = $mainMod , mouse:275, global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = $mainMod , mouse:276, global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = $mainMod , mouse:277, global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = $mainMod , mouse_up,  global, quickshell:searchToggleReleaseInterrupt # [hidden]
bind = $mainMod , mouse_down,global, quickshell:searchToggleReleaseInterrupt # [hidden]

bindit = ,Super_L, global, quickshell:workspaceNumber # [hidden]
bindit = ,Super_R, global, quickshell:workspaceNumber # [hidden]
bind = $mainMod , Tab, global, quickshell:overviewWorkspacesToggle # Toggle overview
bindd = $mainMod , V, Clipboard history >> clipboard, global, quickshell:overviewClipboardToggle # Clipboard history >> clipboard
bindd = $mainMod , Period, Emoji >> clipboard, global, quickshell:overviewEmojiToggle # Emoji >> clipboard
bind = $mainMod , A, global, quickshell:sidebarLeftToggle # Toggle left sidebar
bind = $mainMod +Alt, A, global, quickshell:sidebarLeftToggleDetach # [hidden]
# bind = $mainMod , B, global, quickshell:sidebarLeftToggle # [hidden] # overridden: Super+B = browser
bind = $mainMod , O, global, quickshell:sidebarLeftToggle # [hidden]
bindd = $mainMod , N, Toggle right sidebar, global, quickshell:sidebarRightToggle # Toggle right sidebar
bindd = $mainMod , Slash, Toggle cheatsheet, global, quickshell:cheatsheetToggle # Toggle cheatsheet
# bindd = $mainMod , K, Toggle on-screen keyboard, global, quickshell:oskToggle # Toggle on-screen keyboard # overridden: Super+K = movefocus up
# bindd = $mainMod , M, Toggle media controls, global, quickshell:mediaControlsToggle # Toggle media controls # overridden: Super+M = wlogout
# bind = $mainMod , G, global, quickshell:overlayToggle # Toggle overlay # overridden: Super+G = togglegroup
# bindd = Ctrl+Alt, Delete, Toggle session menu, global, quickshell:sessionToggle # Toggle session menu # overridden: Ctrl+Alt+Delete = hyprctl exit
# bindd = $mainMod , J, Toggle bar, global, quickshell:barToggle # Toggle bar # overridden: Super+J = movefocus down
# bind = Ctrl+Alt, Delete, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill wlogout || wlogout -p layer-shell # [hidden] Session menu (fallback) # overridden: Ctrl+Alt+Delete = hyprctl exit
bind = Shift+$mainMod +Alt, Slash, exec, qs -p ~/.config/quickshell/$qsConfig/welcome.qml # [hidden] Launch welcome app

# bindle=, XF86MonBrightnessUp, exec, qs -c $qsConfig ipc call brightness increment || brightnessctl s 5%+ # [hidden] # overridden: brightness = caelestia
# bindle=, XF86MonBrightnessDown, exec, qs -c $qsConfig ipc call brightness decrement || brightnessctl s 5%- # [hidden] # overridden: brightness = caelestia
# bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5# [hidden] # overridden: volume = 5%+
# bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- # [hidden] # overridden: volume = 5%-

bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle # [hidden]
bindld = $mainMod +Shift,M, Toggle mute, exec, wpctl set-mute @DEFAULT_SINK@ toggle # [hidden]
bindl = Alt ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindld = $mainMod +Alt,M, Toggle mic, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindd = Ctrl+$mainMod , T, Toggle wallpaper selector, global, quickshell:wallpaperSelectorToggle # Wallpaper selector
bindd = Ctrl+$mainMod +Alt, T, Select random wallpaper, global, quickshell:wallpaperSelectorRandom # Random wallpaper
bindd = Ctrl+$mainMod , T, Change wallpaper, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/quickshell/$qsConfig/scripts/colors/switchwall.sh # [hidden] Change wallpaper (fallback)
bind = Ctrl+$mainMod , R, exec, killall ags agsv1 gjs ydotool qs quickshell; qs -c $qsConfig & # Restart widgets
bind = Ctrl+$mainMod , P, global, quickshell:panelFamilyCycle # Cycle panel family

##! Utilities
# Screenshot, Record, OCR, Color picker, Clipboard history
bindd = $mainMod , V, Copy clipboard history entry, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy # [hidden] Clipboard history >> clipboard (fallback)
bindd = $mainMod , Period, Copy an emoji, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || ~/.config/hypr/hyprland/scripts/fuzzel-emoji.sh copy # [hidden] Emoji >> clipboard (fallback)
# bind = $mainMod +Shift, S, global, quickshell:regionScreenshot # Screen snip # overridden: Super+Shift+S = hyprshot
# bind = $mainMod +Shift, S, exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || hyprshot --freeze --clipboard-only --mode region --silent # [hidden] Screen snip (fallback) # overridden
bind = $mainMod +Shift, A, global, quickshell:regionSearch # Google Lens
bind = $mainMod +Shift, A, exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || ~/.config/hypr/hyprland/scripts/snip_to_search.sh # [hidden] Google Lens (fallback)
# OCR
bind = $mainMod +Shift, X, global, quickshell:regionOcr # Character recognition >> clipboard
bind = $mainMod +Shift, T, global, quickshell:regionOcr # [hidden]
bind = $mainMod +Shift, X,exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || grim -g "$(slurp $SLURP_ARGS)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l $(tesseract --list-langs | awk 'NR>1{print $1}' | tr '\\n' '+' | sed 's/\\+$/\\n/') | wl-copy && rm "/tmp/ocr_image.png" # [hidden]
bind = $mainMod +Shift, T,exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || grim -g "$(slurp $SLURP_ARGS)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l $(tesseract --list-langs | awk 'NR>1{print $1}' | tr '\\n' '+' | sed 's/\\+$/\\n/') | wl-copy && rm "/tmp/ocr_image.png" # [hidden]
# Color picker
bindd = $mainMod +Shift, C, Color picker, exec, hyprpicker -a # Pick color (Hex) >> clipboard
# Fullscreen screenshot
bindl = ,Print,exec,grim - | wl-copy # Screenshot >> clipboard
bindln = Ctrl,Print, exec, mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim $(xdg-user-dir PICTURES)/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Screenshot >> clipboard & file (file)
bindln = Ctrl,Print,exec,grim - | wl-copy # [hidden] Screenshot >> clipboard & file (clipboard)
# Recording stuff
# bindl = $mainMod +Shift, R, global, quickshell:regionRecord # Record region (no sound) # overridden: Super+Shift+R = hyprctl reload
# bindl = $mainMod +Shift, R, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/quickshell/$qsConfig/scripts/videos/record.sh # [hidden] Record region (no sound) (fallback) # overridden
bindl = $mainMod +Alt, R, global, quickshell:regionRecord # [hidden] Record region (no sound)
bindl = $mainMod +Alt, R, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/quickshell/$qsConfig/scripts/videos/record.sh # [hidden] Record region (no sound) (fallback)
bindl = Ctrl+Alt, R, exec, ~/.config/quickshell/$qsConfig/scripts/videos/record.sh --fullscreen # [hidden] Record screen (no sound)
bindl = $mainMod +Shift+Alt, R, exec, ~/.config/quickshell/$qsConfig/scripts/videos/record.sh --fullscreen --sound # Record screen (with sound)
# AI
bindd = $mainMod +Shift+Alt, mouse:273, Generate AI summary for selected text, exec, ~/.config/hypr/hyprland/scripts/ai/primary-buffer-query.sh # [hidden] AI summary for selected text

#!
##! Window
# Focusing
bindm = $mainMod , mouse:272, movewindow # Move
bindm = $mainMod , mouse:274, movewindow # [hidden]
bindm = $mainMod , mouse:273, resizewindow # Resize
#/# bind = $mainMod , ←/↑/→/↓,, # Focus in direction
bind = $mainMod , Left, movefocus, l # [hidden]
bind = $mainMod , Right, movefocus, r # [hidden]
bind = $mainMod , Up, movefocus, u # [hidden]
bind = $mainMod , Down, movefocus, d # [hidden]
bind = $mainMod , BracketLeft, movefocus, l # [hidden]
bind = $mainMod , BracketRight, movefocus, r # [hidden]
#/# bind = $mainMod +Shift, ←/↑/→/↓,, # Move in direction
bind = $mainMod +Shift, Left, movewindow, l # [hidden]
bind = $mainMod +Shift, Right, movewindow, r # [hidden]
bind = $mainMod +Shift, Up, movewindow, u # [hidden]
bind = $mainMod +Shift, Down, movewindow, d # [hidden]
bind = Alt, F4, killactive, # [hidden] Close (Windows)
# bind = $mainMod , Q, killactive, # Close # overridden: duplicate of original
bind = $mainMod +Shift+Alt, Q, exec, hyprctl kill # Forcefully zap a window


# Window split ratio
