
general {
    gaps_in = 4
    gaps_out = 5
    gaps_workspaces = 50
    
    border_size = 1
    col.active_border = $primary
    col.inactive_border = $surface
    resize_on_border = true

    no_focus_fallback = true
    
    allow_tearing = true
    
    snap {
    	enabled = true
    }

    layout = dwindle
}

decoration {
    rounding = 10
    
    blur {
        enabled = true
        xray = false
        special = false
        new_optimizations = true
        size = 14
        passes = 2
        brightness = 1
        noise = 0.01
        contrast = 1
        popups = true
        popups_ignorealpha = 0.6
        input_methods = true
        input_methods_ignorealpha = 0.8
    }
    
    shadow {
        enabled = true
        ignore_window = true
        range = 30
        offset = 0 2
        render_power = 4
        color = $shadow
    }
    
    dim_inactive = true
    dim_strength = 0.025
    dim_special = 0.07
}

group {
  col.border_active = $tertiary

  groupbar {
	  col.active = $surface
  }
}

misc {
    background_color = rgba(161217FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(161217FF)
        col.text = rgba(e9e0e7FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(e9e0e7), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(e9e0e7), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(e9e0e7), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color rgba(e4b7f3AA) rgba(e4b7f377), match:pin 1
